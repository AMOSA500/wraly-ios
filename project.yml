# XcodeGen spec — run `xcodegen generate` in this folder to create Wraly.xcodeproj.
name: Wraly
options:
  bundleIdPrefix: com.wraly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: 24M2S8WW68
packages:
  WralyCore:
    path: WralyCore
targets:
  Wraly:
    type: application
    platform: iOS
    sources:
      - path: Wraly
    dependencies:
      - package: WralyCore
    info:
      path: Wraly/Resources/Info.plist
      properties:
        CFBundleDisplayName: Wraly
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [still-camera]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        NSCameraUsageDescription: Wraly uses the camera to see your subject and coach you to a professional portrait.
        NSPhotoLibraryAddUsageDescription: Wraly saves the portraits you take to your photo library.
        NSLocationWhenInUseUsageDescription: Wraly uses your location and compass to work out where the sun is, so it can tell you how to position your subject in the light. Your location never leaves the phone.
        NSMotionUsageDescription: Wraly uses motion sensors to keep your phone level and at the right angle.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nafiuamosa.wraly
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WralyCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WralyCore/Tests/WralyCoreTests
    dependencies:
      - package: WralyCore
schemes:
  Wraly:
    build:
      targets:
        Wraly: all
    test:
      targets:
        - WralyCoreTests
