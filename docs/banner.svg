<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Wraly — your pocket portrait photographer</title>
  <desc id="d">A camera viewfinder framing a person, with a rule-of-thirds grid, a pose skeleton, a focus point on the eye and a level line, next to the Wraly wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="0.55" stop-color="#141824"/>
      <stop offset="1" stop-color="#2A1A0E"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.86" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#FF7A2F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF7A2F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFD27A"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD9A8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FF9F5A" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="frame"><rect x="820" y="40" width="270" height="360" rx="14"/></clipPath>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#sun)"/>

  <!-- Wordmark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="150" font-size="22" letter-spacing="6" fill="#FFB547" font-weight="600">AI PORTRAIT COACH · iOS</text>
    <text x="90" y="262" font-size="132" font-weight="800" letter-spacing="-4" fill="url(#word)">Wraly</text>
    <text x="96" y="318" font-size="30" fill="#C9CEDA" font-weight="400">Your pocket portrait photographer.</text>
    <text x="96" y="362" font-size="20" fill="#7E8597">Reads the light · fixes the angle · coaches the pose · takes the shot.</text>
  </g>

  <!-- Viewfinder -->
  <g clip-path="url(#frame)">
    <rect x="820" y="40" width="270" height="360" fill="#0E1118"/>
    <rect x="820" y="40" width="270" height="360" fill="url(#sun)" opacity="0.6"/>
    <!-- figure silhouette -->
    <g stroke="url(#figure)" stroke-width="18" stroke-linecap="round" fill="none">
      <polyline points="914,200 902,250 918,292"/>
      <polyline points="996,200 1010,248 994,290"/>
    </g>
    <g fill="url(#figure)">
      <ellipse cx="955" cy="122" rx="26" ry="32"/>
      <rect x="946" y="148" width="18" height="40" rx="8"/>
      <path d="M906 198 C918 180 992 180 1004 198 L1004 250 C1000 272 996 288 992 302 L918 302 C914 288 910 272 906 250 Z"/>
      <path d="M918 298 L992 298 L978 400 L958 400 L955 330 L952 400 L932 400 Z"/>
    </g>
    <!-- headroom band -->
    <rect x="900" y="58" width="110" height="26" fill="#FFD27A" opacity="0.12"/>
    <line x1="900" y1="84" x2="1010" y2="84" stroke="#FFD27A" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>
  <!-- thirds grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1">
    <line x1="910" y1="40" x2="910" y2="400"/><line x1="1000" y1="40" x2="1000" y2="400"/>
    <line x1="820" y1="160" x2="1090" y2="160"/><line x1="820" y1="280" x2="1090" y2="280"/>
  </g>
  <!-- skeleton -->
  <g stroke="#5CE1E6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
    <polyline points="912,196 955,186 998,196"/>
    <polyline points="912,196 902,250 918,292"/>
    <polyline points="998,196 1010,248 994,290"/>
    <polyline points="955,186 955,152"/>
    <polyline points="930,300 980,300"/>
    <polyline points="930,300 940,350 942,396"/>
    <polyline points="980,300 972,350 970,396"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="912" cy="196" r="4"/><circle cx="998" cy="196" r="4"/><circle cx="902" cy="250" r="4"/>
    <circle cx="1010" cy="248" r="4"/><circle cx="930" cy="300" r="4"/><circle cx="980" cy="300" r="4"/>
    <circle cx="940" cy="350" r="4"/><circle cx="972" cy="350" r="4"/>
  </g>
  <!-- eye focus point -->
  <g stroke="#FFD27A" stroke-width="2" fill="none">
    <rect x="955" y="106" width="26" height="22" rx="3">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- viewfinder corners -->
  <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M820 74 V40 H854"/><path d="M1056 40 H1090 V74"/>
    <path d="M820 366 V400 H854"/><path d="M1056 400 H1090 V366"/>
  </g>
  <!-- level line -->
  <line x1="915" y1="220" x2="995" y2="220" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- lens height ruler -->
  <rect x="1104" y="250" width="6" height="70" rx="3" fill="#4ADE80" opacity="0.8"/>
  <circle cx="1107" cy="285" r="7" fill="#4ADE80"/>

  <!-- instruction pill -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="1114" y="330" width="160" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="1128" y="352" font-size="11" font-weight="700" fill="#9AA1B2" letter-spacing="1">TELL THEM</text>
    <text x="1128" y="374" font-size="14" font-weight="600" fill="#FFFFFF">Drop your shoulders</text>
  </g>
</svg>
